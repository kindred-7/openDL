name: Publish GitCode releases

on:
  push:
    branches:
      - main
    tags:
      - '*'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitcode-auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      version: ${{ steps.select.outputs.version }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Select an unpublished stable tag
        id: select
        run: |
          $ErrorActionPreference = 'Stop'
          $refs = & git ls-remote --tags --refs https://gitcode.com/kindred-wu/openDL.git
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list GitCode tags.' }
          $tags = @($refs | ForEach-Object {
            if ($_ -match '\srefs/tags/(v?(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$') {
              $tag = $Matches[1]
              [pscustomobject]@{ Tag = $tag; Version = [version]($tag.TrimStart('v')) }
            }
          } | Sort-Object Version -Descending)
          if ($tags.Count -eq 0) { throw 'No stable GitCode version tag found.' }
          if ($tags.Count -gt 1 -and $tags[0].Version -eq $tags[1].Version) { throw 'Multiple tags represent the same newest version.' }
          $tag = $tags[0].Tag
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tags[0].Version)" >> $env:GITHUB_OUTPUT
          $encoded = [Uri]::EscapeDataString($tag)
          $api = 'https://api.gitcode.com/api/v5/repos/kindred-wu/openDL/releases'
          try {
            $release = Invoke-RestMethod -Uri "$api/tags/$encoded"
            if ($release.release_status -eq 'pre' -or $release.prerelease -eq $true) { throw 'The newest tag already has a prerelease; inspect it manually.' }
            $names = @($release.assets | ForEach-Object { $_.name })
            $candidates = @("OpenDL Setup $($tags[0].Version) amd64.exe", "OpenDL.Setup.$($tags[0].Version).amd64.exe")
            if ($names -cnotcontains 'releases.json' -or @($candidates | Where-Object { $names -ccontains $_ }).Count -eq 0) { throw 'The newest release is missing a recognized installer or releases.json; inspect it manually.' }
            Write-Host "Release $tag already exists; nothing to do."
            "publish=false" >> $env:GITHUB_OUTPUT
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
            $latest = Invoke-RestMethod -Uri "$api/latest"
            $latestTag = [string]$latest.tag_name
            if ($latestTag -notmatch '^v?(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$') { throw 'Latest GitCode release has an invalid version.' }
            if ($tags[0].Version -le [version]$latestTag.TrimStart('v')) { throw 'The tag is not newer than the latest published release.' }
            "publish=true" >> $env:GITHUB_OUTPUT
          }

      - name: Fetch and check GitCode source
        if: steps.select.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.select.outputs.tag }}
          RELEASE_VERSION: ${{ steps.select.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          git clone https://gitcode.com/kindred-wu/openDL.git source
          if ($LASTEXITCODE -ne 0) { throw 'Failed to clone GitCode source.' }
          Set-Location source
          git checkout --detach "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to check out the release tag.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release tag is not an ancestor of GitCode main.' }
          $version = [string](Get-Content mygo.json -Raw | ConvertFrom-Json).version
          if ($version -cne $env:RELEASE_VERSION) { throw 'The tag and mygo.json versions differ.' }
          $notes = "docs/release-notes-$version.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing committed release notes: $notes" }

      - name: Install Go
        if: steps.select.outputs.publish == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache: false

      - name: Build installer
        if: steps.select.outputs.publish == 'true'
        working-directory: source
        env:
          RELEASE_VERSION: ${{ steps.select.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          ./scripts/build-windows-installer.ps1
          $candidates = @("OpenDL Setup $env:RELEASE_VERSION amd64.exe", "OpenDL.Setup.$env:RELEASE_VERSION.amd64.exe")
          $found = @($candidates | Where-Object { Test-Path -LiteralPath (Join-Path 'build/windows-amd64' $_) })
          if ($found.Count -ne 1) { throw 'Build must produce exactly one recognized installer.' }
          "INSTALLER_NAME=$($found[0])" >> $env:GITHUB_ENV

      - name: Sign release manifest
        if: steps.select.outputs.publish == 'true'
        working-directory: source
        env:
          RELEASE_TAG: ${{ steps.select.outputs.tag }}
          RELEASE_VERSION: ${{ steps.select.outputs.version }}
          RELEASE_PRIVATE_KEY: ${{ secrets.OPENDL_RELEASE_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:RELEASE_PRIVATE_KEY) { throw 'Missing signing key secret.' }
          $key = Join-Path $env:RUNNER_TEMP ('opendl-key-' + [guid]::NewGuid().ToString('N'))
          try {
            [IO.File]::WriteAllText($key, $env:RELEASE_PRIVATE_KEY.Trim(), [Text.UTF8Encoding]::new($false))
            ./scripts/prepare-gitcode-update.ps1 -Installer (Join-Path 'build/windows-amd64' $env:INSTALLER_NAME) -NotesFile "docs/release-notes-$env:RELEASE_VERSION.md" -PrivateKey $key -Tag $env:RELEASE_TAG
          } finally { Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue }

      - name: Publish on GitCode
        if: steps.select.outputs.publish == 'true'
        working-directory: source
        env:
          RELEASE_TAG: ${{ steps.select.outputs.tag }}
          RELEASE_VERSION: ${{ steps.select.outputs.version }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GITCODE_TOKEN) { throw 'Missing GitCode token secret.' }
          ./scripts/publish-gitcode-release.ps1 -Installer (Join-Path 'build/windows-amd64' $env:INSTALLER_NAME) -Manifest 'build/windows-amd64/releases.json' -NotesFile "docs/release-notes-$env:RELEASE_VERSION.md" -Tag $env:RELEASE_TAG

  sync-github:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fetch the published GitCode release and source
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$' -or ($env:RELEASE_TAG -cne $env:RELEASE_VERSION -and $env:RELEASE_TAG -cne "v$env:RELEASE_VERSION")) { throw 'Invalid release tag.' }
          $tag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $api = 'https://api.gitcode.com/api/v5/repos/kindred-wu/openDL/releases'
          $release = Invoke-RestMethod -Uri "$api/tags/$tag"
          $names = @($release.assets | ForEach-Object { $_.name })
          # Prefer the historical asset when both names exist, matching the
          # previous workflow's behavior for already-published releases.
          $candidates = @("OpenDL.Setup.$env:RELEASE_VERSION.amd64.exe", "OpenDL Setup $env:RELEASE_VERSION amd64.exe")
          $found = @($candidates | Where-Object { $names -ccontains $_ })
          if ($release.release_status -eq 'pre' -or $release.prerelease -eq $true -or $found.Count -eq 0 -or $names -cnotcontains 'releases.json') { throw 'GitCode release is missing a recognized installer or releases.json.' }
          $installer = $found[0]
          "INSTALLER_NAME=$installer" >> $env:GITHUB_ENV
          git clone https://gitcode.com/kindred-wu/openDL.git source
          if ($LASTEXITCODE -ne 0) { throw 'Failed to clone GitCode source.' }
          Set-Location source
          git checkout --detach "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to check out the release tag.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag is not on GitCode main.' }
          $version = [string](Get-Content mygo.json -Raw | ConvertFrom-Json).version
          if ($version -cne $env:RELEASE_VERSION) { throw 'Release tag and source version differ.' }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          foreach ($name in @($installer, 'releases.json')) {
            $nameEncoded = [Uri]::EscapeDataString($name)
            try { Invoke-WebRequest -Uri "$api/$tag/attach_files/$nameEncoded/download" -OutFile (Join-Path 'release-assets' $name) }
            catch { throw "Failed to download GitCode asset: $name" }
          }

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache: false

      - name: Verify signed release assets
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $match = [regex]::Match([IO.File]::ReadAllText('cmd/opendl/page_update.go'), '(?m)^var officialUpdatePublicKey = "([^"]+)"')
          if (-not $match.Success) { throw 'Cannot determine the update public key.' }
          $key = Join-Path $env:RUNNER_TEMP ('opendl-public-' + [guid]::NewGuid().ToString('N'))
          try {
            [IO.File]::WriteAllText($key, $match.Groups[1].Value, [Text.UTF8Encoding]::new($false))
            $installer = Join-Path 'release-assets' $env:INSTALLER_NAME
            & go run ./cmd/release-sign -verify release-assets/releases.json -public $key -asset "windows/amd64/installer=$installer"
            if ($LASTEXITCODE -ne 0) { throw 'GitCode assets failed signature or checksum verification.' }
          } finally { Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue }
          $envelope = Get-Content release-assets/releases.json -Raw | ConvertFrom-Json
          $manifest = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($envelope.payload)) | ConvertFrom-Json
          if ($manifest.version -cne $env:RELEASE_VERSION) { throw 'Signed manifest version differs from release tag.' }

      - name: Create or complete GitHub release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[a-f0-9]{40}$') { throw 'Cannot determine the source commit.' }
          $repo = $env:GH_REPO
          $tag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "https://api.github.com/repos/$repo"
          try { $existingTag = Invoke-RestMethod -Headers $headers -Uri "$api/commits/$tag" }
          catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw 'Failed to inspect the GitHub tag.' }
            $existingTag = $null
          }
          if ($existingTag) {
            if ($existingTag.sha -cne $sha) { throw 'The GitHub tag points to a different commit; it will not be replaced.' }
          } else {
            try { Invoke-RestMethod -Headers $headers -Uri "$api/commits/$sha" | Out-Null }
            catch { throw 'The GitCode release commit is not present on GitHub. Push main to GitHub first.' }
            $body = @{ ref = "refs/tags/$env:RELEASE_TAG"; sha = $sha } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post -Headers $headers -Uri "$api/git/refs" -ContentType 'application/json' -Body $body | Out-Null
          }
          # Draft releases are invisible to get-by-tag and to this token's
          # release listing, so publish directly and look releases up by tag
          # only. A pre-existing draft is adopted instead of a duplicate.
          $notes = "docs/release-notes-$env:RELEASE_VERSION.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Release notes are missing.' }
          $release = $null
          try { $release = Invoke-RestMethod -Headers $headers -Uri "$api/releases/tags/$tag" }
          catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw 'Failed to inspect the GitHub release.' }
          }
          if (-not $release) {
            & gh release create $env:RELEASE_TAG --repo $repo --verify-tag --title "OpenDL $env:RELEASE_VERSION" --notes-file $notes (Join-Path 'release-assets' $env:INSTALLER_NAME) (Join-Path 'release-assets' 'releases.json')
            if ($LASTEXITCODE -ne 0) {
              # 该标签已有草稿发布时补全并转为正式发布，其余失败仍报错。
              & gh release edit $env:RELEASE_TAG --repo $repo --draft=false --title "OpenDL $env:RELEASE_VERSION" --notes-file $notes
              if ($LASTEXITCODE -ne 0) { throw 'Failed to create the GitHub release.' }
            }
            $release = Invoke-RestMethod -Headers $headers -Uri "$api/releases/tags/$tag"
          }
          $installer = $env:INSTALLER_NAME
          foreach ($name in @($installer, 'releases.json')) {
            $existing = @($release.assets | Where-Object { $_.name -ceq $name })
            $local = Join-Path 'release-assets' $name
            if ($existing.Count -gt 1) { throw "Duplicate GitHub asset: $name" }
            if ($existing.Count -eq 1) {
              $temp = Join-Path $env:RUNNER_TEMP ('opendl-github-' + [guid]::NewGuid().ToString('N'))
              New-Item -ItemType Directory -Path $temp | Out-Null
              try {
                $dest = Join-Path $temp $name
                Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' } -Uri $existing[0].url -OutFile $dest
                if ((Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $local -Algorithm SHA256).Hash) { throw "Existing GitHub asset differs: $name" }
              } finally { Remove-Item -LiteralPath $temp -Recurse -Force -ErrorAction SilentlyContinue }
            } else {
              # 补传缺失资产以便断点重跑；已存在的资产永不替换。
              $upload = ($release.upload_url -replace '\{\?name,label\}$', '') + '?name=' + [Uri]::EscapeDataString($name)
              Invoke-RestMethod -Method Post -Headers $headers -Uri $upload -ContentType 'application/octet-stream' -Body ([IO.File]::ReadAllBytes($local)) | Out-Null
            }
          }
